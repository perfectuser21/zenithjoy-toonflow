# 仅创建服务的运行时目录；不移除遗留 socket 或状态文件。
d /run/toonflow-trim-worker 0750 root toonflow-trim-access -
d /run/toonflow-trim-store 0750 root toonflow-trim-access -
d /run/toonflow-trim-docker 0750 root toonflow-trim-docker -
d /run/toonflow-trim-maintenance 0700 root root -
# 供 root 发布无凭据的进程实例启动回执；文件只可由 root 创建。
d /run/toonflow-trim-admission 0755 root root -
# 预先建立持久锁，串行化监听代际见证；不删除已有内容。
f /etc/toonflow-trim/runtime-proofs.lock 0600 root root -
# Attested worker only: root owns the maintenance flag and the lock inode.
d /var/lib/toonflow-trim/ingress 0750 root toonflow-trim-access -
f /var/lib/toonflow-trim/ingress/access.lock 0640 root toonflow-trim-access -
