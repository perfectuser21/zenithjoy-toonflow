set $canvasUnavailableUri /__canvasUnavailable;
if ($uri ~ ^/(api|a2a|mcp)(/|$)) {
    set $canvasUnavailableUri /__canvasApiUnavailable;
}
error_page 502 = $canvasUnavailableUri;

location = /__canvasUnavailable {
    internal;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>画布暂不可用</title><main><h1>画布暂不可用</h1><p>服务暂时无法连接，请稍后重试。如果另有画布页面仍打开，请保留该页面。</p></main></html>';
}

location = /__canvasApiUnavailable {
    internal;
    default_type application/json;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 503 '{"code":503,"message":"画布服务暂时无法连接。请保留当前页面，稍后重试。","data":null}';
}
