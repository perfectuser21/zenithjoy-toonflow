name: Server build
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "patches/**"
      - "package.json"
      - "appVersion.ts"
      - "electrobun.config.ts"
      - "tsconfig.base.json"
      - "bun.lock"
      - "Dockerfile"
      - "deploy/quota/**"
      - ".github/workflows/serverBuild.yml"
      - ".github/workflows/candidateImage.yml"
      - ".github/workflows/canvasDelivery.yml"
      - "deploy/delivery/**"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck server
        run: bun run --cwd apps/server typecheck
      - name: Typecheck canvas web
        run: bun run --cwd apps/web typecheck
      - run: bun run build:server
