name: Server build
on:
  workflow_call:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "patches/**"
      - "package.json"
      - "appVersion.ts"
      - "electrobun.config.ts"
      - "tsconfig.base.json"
      - "bun.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/quota/**"
      - ".github/workflows/serverBuild.yml"
      - ".github/workflows/candidateImage.yml"
      - ".github/workflows/canvasDelivery.yml"
      - "deploy/delivery/**"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install FFmpeg for media regression
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test trusted canvas nodes and ordered video exports
        run: bun test apps/server/src/utils/plugins/trustedNodeInitialization.test.ts
      - name: Test simultaneous clip previews
        run: bun test apps/server/src/utils/media/trimReadQueue.test.ts
      - name: Typecheck server
        run: bun run --cwd apps/server typecheck
      - name: Typecheck canvas web
        run: bun run --cwd apps/web typecheck
      - name: Typecheck mashup node
        run: bun run --cwd packages/nodes/mashupNode typecheck
      - run: bun run build:server
