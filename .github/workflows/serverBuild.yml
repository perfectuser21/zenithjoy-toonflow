name: Server build
on:
  workflow_call:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    name: Toonflow PR regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Ensure FFmpeg for media regression
        timeout-minutes: 10
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 update
            sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Typecheck server
        run: bun run --cwd apps/server typecheck
      - name: Typecheck canvas web
        run: bun run --cwd apps/web typecheck
      - name: Typecheck mashup node
        run: bun run --cwd packages/nodes/mashupNode typecheck
      - run: bun run build:server
      - name: Test canvas browser journeys and video exports
        env:
          RELEASE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python3 - "${RELEASE_PR_BASE_SHA:?Missing PR base SHA}" <<'PY'
          import ast
          from pathlib import Path
          import subprocess
          import sys

          path = 'deploy/delivery/releasePolicy.py'
          environments = {'staging', 'production'}

          def readJourneys(source, initial=False):
              assignments = [node.value for node in ast.parse(source).body if isinstance(node, ast.Assign)
                             and any(isinstance(target, ast.Name) and target.id == 'requiredBusinessJourneys'
                                     for target in node.targets)]
              if initial and not assignments:
                  return {environment: set() for environment in environments}
              if len(assignments) != 1:
                  raise RuntimeError('expected a single literal requiredBusinessJourneys registry')
              journeys = ast.literal_eval(assignments[0])
              if not isinstance(journeys, dict) or journeys.keys() != environments:
                  raise RuntimeError('requiredBusinessJourneys must cover staging and production')
              for environment, ids in journeys.items():
                  if (not isinstance(ids, tuple) or not ids or not all(isinstance(id, str) and id for id in ids)
                          or len(set(ids)) != len(ids)):
                      raise RuntimeError('invalid requiredBusinessJourneys for ' + environment)
              return {environment: set(ids) for environment, ids in journeys.items()}

          base, = sys.argv[1:]
          exists = subprocess.check_output(['git', 'ls-tree', '--name-only', base, '--', path], text=True)
          baseSource = subprocess.check_output(['git', 'show', f'{base}:{path}'], text=True) if exists else ''
          previous = readJourneys(baseSource, initial=True)
          current = readJourneys(Path(path).read_text())
          for environment, required in previous.items():
              missing = sorted(required - current[environment])
              if missing:
                  raise RuntimeError(f'{environment} required release journeys removed: {", ".join(missing)}')
          PY
          fi
          python3 -B - <<'PY'
          import hashlib
          import io
          import json
          from pathlib import Path
          import tempfile
          import unittest
          from unittest.mock import patch

          import sys
          sys.path.insert(0, 'deploy/delivery')
          import releaseHost


          class ProductionCutoverTest(unittest.TestCase):
              def test_failed_candidate_leaves_public_incumbent_running(self):
                  self.assertEqual(self.release(candidate_passes=False), ('old', []))

              def test_verified_candidate_can_become_public(self):
                  self.assertEqual(self.release(candidate_passes=True), ('candidate', ['verified']))

              def release(self, candidate_passes):
                  with tempfile.TemporaryDirectory() as state:
                      return self.drive_release(Path(state), candidate_passes)

              def drive_release(self, state, candidate_passes):
                  (state / 'identity.json').write_text('{"environment":"production"}')
                  (state / 'quotaHelper').write_bytes(b'')
                  config = {
                      'environment': 'production', 'publicOrigin': releaseHost.publicOrigins['production'],
                      'stateDirectory': str(state), 'dataDirectory': '/live', 'container': 'public',
                      'service': 'public.service', 'businessConfig': '/business.json',
                      'quotaHelper': str(state / 'quotaHelper'), 'quotaHelperSha256': hashlib.sha256(b'').hexdigest(),
                      'businessVerifier': 'verify', 'backupCommand': 'backup', 'restoreVerifier': 'restore',
                      'switchCommand': 'switch', 'readinessCommand': 'ready', 'stagingWitness': 'witness',
                  }
                  (state / 'release.json').write_text(json.dumps(config))
                  stage = {'transfer': {'key': 'object', 'sha256': 'a' * 64, 'bytes': 1}}
                  request = {'environment': 'production', 'sourceSha': '1' * 40,
                             'image': 'ghcr.io/perfectuser21/zenithjoy-toonflow@sha256:' + 'a' * 64,
                             'runId': '42', 'runAttempt': '1', 'transfer': stage['transfer'], 'stagingReceipt': stage}
                  public = 'old'
                  verification = []

                  def candidate(*_):
                      if not candidate_passes:
                          raise RuntimeError('production candidate generation failed')
                      verification.append('verified')
                      return {'bootId': 'candidate-boot'}

                  def run(args, **_):
                      nonlocal public
                      if args[0] == 'witness':
                          return json.dumps(stage)
                      if args[0] == 'systemctl':
                          return '/usr/bin/docker start -a public'
                      if args[0] == 'docker':
                          return json.dumps([{'Config': {'Labels': {'org.opencontainers.image.revision': request['sourceSha']}}}])
                      if args[0] == 'backup':
                          public = 'offline'
                          return json.dumps({'backupVerified': True, 'restoreVerified': True,
                                             'quotaRestoreVerified': True, 'backupId': '1'})
                      if args[0] == 'switch':
                          public = 'candidate'
                      if args[0] == 'verify':
                          return '{}'
                      return ''

                  business = {'environment': 'production', 'publicOrigin': config['publicOrigin'],
                              'generationRequest': {'mediaType': 'video', 'providerId': 'multiTenant', 'modelId': 'wan3.0-video-prime'}}
                  with patch.multiple(
                      releaseHost, configPath=state / 'release.json', run=run,
                      rootFile=lambda path, **_: path, rootJson=lambda *_a, **_k: business,
                      validateBusinessConfig=lambda *_: None, validateGenerationConfig=lambda *_: None,
                      validateCosTransfer=lambda *_: None, validateReceipt=lambda *_: None, ensureImage=lambda *_: None,
                      inspect=lambda *_: {'Id': public, 'Image': public, 'Config': {'Image': public},
                                         'State': {'Running': True}}, imageId=lambda *_: 'candidate',
                  ), patch.object(releaseHost, 'verifyProductionCandidate', candidate, create=True), patch.object(
                      releaseHost.os, 'geteuid', return_value=0
                  ), patch.object(releaseHost.sys, 'stdin', io.TextIOWrapper(io.BytesIO(json.dumps(request).encode()))), patch(
                      'sys.stdout', io.StringIO()
                  ):
                      try:
                          releaseHost.main()
                      except RuntimeError:
                          if candidate_passes:
                              raise
                  self.assertEqual((state / '42-1.json').exists(), candidate_passes)
                  return public, verification

          unittest.main()
          PY
          bun test apps/server/src/utils/plugins/trustedNodeInitialization.test.ts
      - name: Test simultaneous clip previews
        run: bun test apps/server/src/utils/media/trimReadQueue.test.ts
