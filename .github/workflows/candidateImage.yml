name: Build candidate image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Immutable image produced for the caller commit
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read
  packages: write

concurrency:
  group: aivideo-candidate-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0
      - name: Log in to private container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=aivideo-candidate-linux-amd64
          cache-to: type=gha,scope=aivideo-candidate-linux-amd64,mode=max
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable candidate
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo '### AIvideo candidate image'
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "Image: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo 'This step does not deploy or approve the candidate.'
          } >> "$GITHUB_STEP_SUMMARY"
