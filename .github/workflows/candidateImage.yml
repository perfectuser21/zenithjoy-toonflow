name: Build candidate image

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CANVAS_COS_SECRET_ID:
        required: true
      CANVAS_COS_SECRET_KEY:
        required: true
    outputs:
      image:
        description: Immutable image produced for the caller commit
        value: ${{ jobs.image.outputs.image }}
      archiveKey:
        value: ${{ jobs.image.outputs.archiveKey }}
      archiveSha256:
        value: ${{ jobs.image.outputs.archiveSha256 }}
      archiveBytes:
        value: ${{ jobs.image.outputs.archiveBytes }}

permissions:
  contents: read
  packages: write

concurrency:
  group: aivideo-candidate-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
      archiveKey: ${{ steps.archive.outputs.key }}
      archiveSha256: ${{ steps.archive.outputs.sha256 }}
      archiveBytes: ${{ steps.archive.outputs.bytes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0
      - name: Log in to private container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          # 固定证明文件格式，与现役完整归档校验器保持兼容。
          outputs: type=registry,oci-artifact=false
          cache-from: type=gha,scope=aivideo-candidate-linux-amd64
          cache-to: type=gha,scope=aivideo-candidate-linux-amd64,mode=max,ignore-error=true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Install OCI and COS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          python3 -m venv "$RUNNER_TEMP/cos-venv"
          "$RUNNER_TEMP/cos-venv/bin/pip" install setuptools==80.9.0 wheel==0.45.1
          "$RUNNER_TEMP/cos-venv/bin/pip" install --no-build-isolation -r deploy/delivery/cosRequirements.txt
      - name: Export and verify candidate OCI
        id: prepare
        timeout-minutes: 20
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: '"$RUNNER_TEMP/cos-venv/bin/python" deploy/delivery/publishCosArchive.py prepare'
      - name: Upload verified private COS archive
        id: archive
        timeout-minutes: 15
        env:
          CANDIDATE_IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          CANVAS_COS_BUCKET: ${{ vars.CANVAS_COS_BUCKET }}
          CANVAS_COS_REGION: ${{ vars.CANVAS_COS_REGION }}
          CANVAS_COS_SECRET_ID: ${{ secrets.CANVAS_COS_SECRET_ID }}
          CANVAS_COS_SECRET_KEY: ${{ secrets.CANVAS_COS_SECRET_KEY }}
        run: '"$RUNNER_TEMP/cos-venv/bin/python" deploy/delivery/publishCosArchive.py upload'
      - name: Record COS phase outcomes
        if: always()
        timeout-minutes: 1
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          UPLOAD_OUTCOME: ${{ steps.archive.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'cos-stage-results.json')
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as out:
              json.dump({'prepare': os.environ['PREPARE_OUTCOME'], 'upload': os.environ['UPLOAD_OUTCOME']}, out)
          PY
      - name: Preserve private COS evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cos-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cos-stage-results.json
            ${{ runner.temp }}/candidate-oci-${{ github.run_id }}-${{ github.run_attempt }}/identity.json
            ${{ runner.temp }}/candidate-oci-${{ github.run_id }}-${{ github.run_attempt }}/multipart.json
          if-no-files-found: warn
      - name: Record immutable candidate
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo '### AIvideo candidate image'
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "Image: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo 'This step does not deploy or approve the candidate.'
          } >> "$GITHUB_STEP_SUMMARY"
