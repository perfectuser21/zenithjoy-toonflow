name: Build candidate image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: aivideo-candidate-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to private container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable candidate
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo '### AIvideo candidate image'
            echo "Source commit: \`$SOURCE_SHA\`"
            echo "Image: \`$IMAGE_NAME@$IMAGE_DIGEST\`"
            echo 'This step does not deploy or approve the candidate.'
          } >> "$GITHUB_STEP_SUMMARY"
