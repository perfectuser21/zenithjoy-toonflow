name: Canvas delivery

on:
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'patches/**'
      - 'bun.lock'
      - 'package.json'
      - 'appVersion.ts'
      - 'canvasRelease.ts'
      - 'electrobun.config.ts'
      - 'tsconfig.base.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/candidateImage.yml'
      # Host delivery tools are installed and checked before a manual release.
      - '!deploy/delivery/**'
      - '!apps/**/*.test.ts'
      - '!packages/**/*.test.ts'
  workflow_dispatch:
    inputs:
      staging_run:
        description: 'Approved staging run ID. Leave empty to deploy staging only.'
        type: string
      team_verified:
        description: 'The team tested and approved this version on Hong Kong staging.'
        type: boolean
        default: false
      notes_run:
        description: 'Sync Notion only for this completed Canvas delivery run ID.'
        type: string

permissions:
  contents: read

concurrency:
  group: canvas-delivery
  cancel-in-progress: false

jobs:
  regression:
    if: vars.CANVAS_DELIVERY_ENABLED == 'true' && !inputs.notes_run && (github.event_name == 'push' || inputs.staging_run == '')
    uses: ./.github/workflows/serverBuild.yml

  candidate:
    needs: regression
    if: vars.CANVAS_DELIVERY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/candidateImage.yml
    secrets:
      CANVAS_COS_SECRET_ID: ${{ secrets.CANVAS_COS_SECRET_ID }}
      CANVAS_COS_SECRET_KEY: ${{ secrets.CANVAS_COS_SECRET_KEY }}

  staging:
    permissions:
      contents: read
      packages: read
    needs: candidate
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install COS signing SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/cos-venv"
          "$RUNNER_TEMP/cos-venv/bin/pip" install setuptools==80.9.0 wheel==0.45.1
          "$RUNNER_TEMP/cos-venv/bin/pip" install --no-build-isolation -r deploy/delivery/cosRequirements.txt
      - name: Deploy and verify Hong Kong customer staging
        id: deploy
        env:
          RELEASE_HOST: ${{ vars.CANVAS_RELEASE_HOST }}
          RELEASE_PORT: ${{ vars.CANVAS_RELEASE_PORT }}
          RELEASE_USER: ${{ vars.CANVAS_RELEASE_USER }}
          RELEASE_KEY: ${{ secrets.CANVAS_RELEASE_SSH_KEY }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.CANVAS_RELEASE_KNOWN_HOSTS }}
          RELEASE_IMAGE: ${{ needs.candidate.outputs.image }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ENVIRONMENT: staging
          RELEASE_COS_KEY: ${{ needs.candidate.outputs.archiveKey }}
          RELEASE_COS_SHA256: ${{ needs.candidate.outputs.archiveSha256 }}
          RELEASE_COS_BYTES: ${{ needs.candidate.outputs.archiveBytes }}
          CANVAS_COS_BUCKET: ${{ vars.CANVAS_COS_BUCKET }}
          CANVAS_COS_REGION: ${{ vars.CANVAS_COS_REGION }}
          CANVAS_COS_SECRET_ID: ${{ secrets.CANVAS_COS_SECRET_ID }}
          CANVAS_COS_SECRET_KEY: ${{ secrets.CANVAS_COS_SECRET_KEY }}
        run: bash deploy/delivery/remoteRelease.sh
      - name: Save staging receipt for manual promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-release-${{ github.run_attempt }}
          path: releaseReceipt.json
          if-no-files-found: error
      - name: Publish staging evidence
        if: always()
        run: |
          if [ -f releaseReceipt.json ]; then
            cat releaseReceipt.json >> "$GITHUB_STEP_SUMMARY"
          fi

  production:
    if: vars.CANVAS_DELIVERY_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && !inputs.notes_run && inputs.staging_run != '' && inputs.team_verified
    permissions:
      actions: read
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the approved staging receipt
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN: ${{ inputs.staging_run }}
        run: |
          [[ "$STAGING_RUN" =~ ^[1-9][0-9]*$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN")
          jq -e '.path == ".github/workflows/canvasDelivery.yml" and
            .head_branch == "master" and .status == "completed" and
            (.event == "push" or .event == "workflow_dispatch")' <<< "$run" > /dev/null
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.name == "staging" and .conclusion == "success") | .run_attempt')
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          source=$(jq -er '.head_sha' <<< "$run")
          gh run download "$STAGING_RUN" --repo "$GITHUB_REPOSITORY" --name "staging-release-$attempt" --dir "$RUNNER_TEMP/approved-staging"
          receipt="$RUNNER_TEMP/approved-staging/releaseReceipt.json"
          PYTHONPATH=deploy/delivery python3 -B - "$receipt" "$source" "$STAGING_RUN" "$attempt" <<'PY'
          import json, os, sys
          from releasePolicy import publicReceipt, validateReceipt

          path, source, run, attempt = sys.argv[1:]
          with open(path) as receiptFile:
              receipt = json.load(receiptFile)
          request = {'sourceSha': source, 'runId': run, 'runAttempt': attempt, 'image': receipt['image']}
          validateReceipt(receipt, request, 'staging')
          transfer = receipt['transfer']
          if transfer['bytes'] > 768 * 1024 * 1024:
              raise RuntimeError('staging COS archive exceeds release limit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('image=' + receipt['image'], file=output)
              print('source=' + source, file=output)
              print('archive_key=' + transfer['key'], file=output)
              print('archive_sha256=' + transfer['sha256'], file=output)
              print('archive_bytes=' + str(transfer['bytes']), file=output)
              print('receipt=' + json.dumps(publicReceipt(receipt), separators=(',', ':')), file=output)
          PY
          jq -n --arg source "$source" '{sourceSha: $source}' > releaseContext.json
      - name: Save production candidate identity for release notes
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-context-${{ github.run_attempt }}
          path: releaseContext.json
          if-no-files-found: error
      - name: Install COS signing SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/cos-venv"
          "$RUNNER_TEMP/cos-venv/bin/pip" install setuptools==80.9.0 wheel==0.45.1
          "$RUNNER_TEMP/cos-venv/bin/pip" install --no-build-isolation -r deploy/delivery/cosRequirements.txt
      - name: Promote same digest to Hangzhou
        id: deploy
        env:
          RELEASE_HOST: ${{ vars.CANVAS_RELEASE_HOST }}
          RELEASE_PORT: ${{ vars.CANVAS_RELEASE_PORT }}
          RELEASE_USER: ${{ vars.CANVAS_RELEASE_USER }}
          RELEASE_KEY: ${{ secrets.CANVAS_RELEASE_SSH_KEY }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.CANVAS_RELEASE_KNOWN_HOSTS }}
          RELEASE_JUMP_HOST: ${{ vars.CANVAS_RELEASE_JUMP_HOST }}
          RELEASE_JUMP_PORT: ${{ vars.CANVAS_RELEASE_JUMP_PORT }}
          RELEASE_JUMP_USER: ${{ vars.CANVAS_RELEASE_JUMP_USER }}
          RELEASE_JUMP_KEY: ${{ secrets.CANVAS_RELEASE_JUMP_KEY }}
          RELEASE_JUMP_KNOWN_HOSTS: ${{ secrets.CANVAS_RELEASE_JUMP_KNOWN_HOSTS }}
          RELEASE_IMAGE: ${{ steps.staged.outputs.image }}
          RELEASE_SHA: ${{ steps.staged.outputs.source }}
          RELEASE_ENVIRONMENT: production
          RELEASE_STAGING_RECEIPT: ${{ steps.staged.outputs.receipt }}
          RELEASE_COS_KEY: ${{ steps.staged.outputs.archive_key }}
          RELEASE_COS_SHA256: ${{ steps.staged.outputs.archive_sha256 }}
          RELEASE_COS_BYTES: ${{ steps.staged.outputs.archive_bytes }}
          CANVAS_COS_BUCKET: ${{ vars.CANVAS_COS_BUCKET }}
          CANVAS_COS_REGION: ${{ vars.CANVAS_COS_REGION }}
          CANVAS_COS_SECRET_ID: ${{ secrets.CANVAS_COS_SECRET_ID }}
          CANVAS_COS_SECRET_KEY: ${{ secrets.CANVAS_COS_SECRET_KEY }}
        run: bash deploy/delivery/remoteRelease.sh
      - name: Save verified production receipt
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-${{ github.run_attempt }}
          path: releaseReceipt.json
          if-no-files-found: error
      - name: Publish production evidence
        if: always()
        run: |
          if [ -f releaseReceipt.json ]; then
            cat releaseReceipt.json >> "$GITHUB_STEP_SUMMARY"
          fi

  release_notes:
    name: Sync Notion release notes
    needs: [staging, production]
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      (inputs.notes_run != '' || needs.staging.result != 'skipped' || needs.production.result != 'skipped')
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: release-notes
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record release result in Notion
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_RUN: ${{ inputs.notes_run }}
          NOTES_HOST: ${{ vars.CANVAS_NOTES_HOST }}
          NOTES_PORT: ${{ vars.CANVAS_NOTES_PORT }}
          NOTES_SSH_KEY: ${{ secrets.CANVAS_NOTES_SSH_KEY }}
          NOTES_KNOWN_HOSTS: ${{ vars.CANVAS_NOTES_KNOWN_HOSTS }}
        run: bash releaseNotes/syncCanvasReleaseFromCd.sh
